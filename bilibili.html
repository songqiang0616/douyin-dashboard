const groups = [{"tagid": -10, "name": "特别关注", "count": 0}, {"tagid": 0, "name": "默认分组", "count": 145}];
let currentCategory = '';

function switchTab(tab) {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    if (tab === 'videos') {
        document.querySelectorAll('.tab')[0].classList.add('active');
        document.getElementById('videos-panel').style.display = '';
        document.getElementById('follows-panel').style.display = 'none';
    } else {
        document.querySelectorAll('.tab')[1].classList.add('active');
        document.getElementById('videos-panel').style.display = 'none';
        document.getElementById('follows-panel').style.display = '';
        renderFollows();
    }
}

function formatDuration(s) {
    if (!s || s <= 0) return '';
    var m = Math.floor(s / 60), sec = s % 60, h = Math.floor(m / 60), min = m % 60;
    return h ? h + ':' + String(min).padStart(2,'0') + ':' + String(sec).padStart(2,'0') : min + ':' + String(sec).padStart(2,'0');
}

function escapeHtml(s) {
    var d = document.createElement('div'); d.textContent = s; return d.innerHTML;
}

function filterVideos() {
    var q = document.getElementById('search').value.toLowerCase();
    var filtered = videos.filter(function(v) {
        if (currentCategory && (v._category || '未分类') !== currentCategory) return false;
        if (q) return (v.title || '').toLowerCase().includes(q) || (v.upper_name || '').toLowerCase().includes(q);
        return true;
    });
    renderVideos(filtered);
    document.getElementById('stats').textContent = filtered.length + ' / ' + videos.length;
}

function setCategory(cat) {
    currentCategory = cat;
    document.querySelectorAll('#category-chips .chip').forEach(function(c) { c.classList.remove('active'); });
    event.target.classList.add('active');
    filterVideos();
}

function renderVideos(list) {
    var grid = document.getElementById('video-grid');
    if (!list.length) { grid.innerHTML = '<div class="empty">没有找到视频</div>'; return; }
    grid.innerHTML = list.map(function(v) {
        return '<div class="card">' +
            '<img class="card-cover" src="' + (v.cover || '') + '" alt="" onerror="this.style.display=\'none\'">' +
            '<div class="card-body">' +
                '<div class="card-title"><a href="https://www.bilibili.com/video/' + v.bvid + '" target="_blank">' + escapeHtml(v.title || '未知标题') + '</a></div>' +
                '<div class="card-meta">' +
                    '<a href="https://space.bilibili.com/' + v.upper_mid + '" target="_blank">' + escapeHtml(v.upper_name || '') + '</a>' +
                    '<span>' + formatDuration(v.duration) + '</span>' +
                '</div>' +
                '<div style="margin-top:6px">' +
                    '<span class="card-tag">' + escapeHtml(v._category || '未分类') + '</span>' +
                '</div>' +
                '<div class="card-folder">' + escapeHtml(v._folder || '') + '</div>' +
            '</div>' +
        '</div>';
    }).join('');
}

function filterFollows() {
    var q = document.getElementById('follow-search').value.toLowerCase();
    var filtered = follows.filter(function(u) { return (u.uname || '').toLowerCase().includes(q) || (u.sign || '').toLowerCase().includes(q); });
    renderFollows(filtered);
}

function renderFollows(list) {
    list = list || follows;
    var el = document.getElementById('follow-list');
    if (!list.length) { el.innerHTML = '<div class="empty">没有找到UP主</div>'; return; }
    el.innerHTML = list.map(function(u) {
        var groups = '';
        if (u._group_names && u._group_names.length) {
            groups = u._group_names.map(function(g) { return '<span class="follow-group">' + escapeHtml(g) + '</span>'; }).join('');
        }
        return '<div class="follow-item">' +
            '<img class="follow-avatar" src="' + (u.face || '') + '" onerror="this.style.display=\'none\'">' +
            '<div class="follow-info">' +
                '<div class="follow-name">' +
                    '<a href="https://space.bilibili.com/' + u.mid + '" target="_blank">' + escapeHtml(u.uname || '') + '</a>' +
                    (u.special ? ' <span class="follow-special">特别关注</span>' : '') +
                '</div>' +
                '<div class="follow-sign">' + escapeHtml(u.sign || '') + '</div>' +
            '</div>' +
            groups +
        '</div>';
    }).join('');
}

filterVideos();
</script>
